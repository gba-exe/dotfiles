set -g base-index 1
setw -g pane-base-index 1

set -g mouse on

unbind C-b
set -g prefix C-s
bind C-a send-prefix

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Status bar position
set -g status-position top
# Status bar colors
set -g status-style 'bg=#4495c7 fg=#416175'
set -g status-left-length 20
set -g status-right-length 50
# Status bar content
set -g status-left '#[fg=#000000,bold] #S #[fg=#000000]│ '
set -g status-right '#[fg=#000000]│#[fg=#000000] %H:%M #[fg=#000000]│#[fg=#000000] %d-%b-%y '
# Window status
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#000000,bold] #I:#W '
# Pane border colors
set -g pane-border-style 'fg=#000000'
set -g pane-active-border-style 'fg=#000000'
# Message styling
set -g message-style 'bg=#4495c7 fg=#000000 bold'


# Use vi key
setw -g mode-keys vi

# Vi-style copy bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"  # macOS
# bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"  # Linux
